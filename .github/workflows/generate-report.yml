name: Generate report

on:
  workflow_dispatch:
    inputs:
      month:
        description: Month to generate a report for (YYYY-MM)
        required: true
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Seeds dist/clients/isogreen/reports/ with whatever's already
      # published so this run's index rebuild (in generate-report.js)
      # covers every previously-generated month, not just this one.
      - name: Seed existing published reports
        run: |
          git clone -q "https://x-access-token:${DASHBOARD_REPO_PAT}@github.com/4642337DSC/isogreen-dailies-dashboard.git" /tmp/dashboard-repo
          mkdir -p dist/clients/isogreen/reports
          if [ -d /tmp/dashboard-repo/isogreen/reports ]; then
            cp -r /tmp/dashboard-repo/isogreen/reports/. dist/clients/isogreen/reports/
          fi
        env:
          DASHBOARD_REPO_PAT: ${{ secrets.DASHBOARD_REPO_PAT }}

      - name: Generate report
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CHANNEL_STATS_DATABASE_ID: ${{ secrets.CHANNEL_STATS_DATABASE_ID }}
          MONTHLY_VIEWS_DATABASE_ID: ${{ secrets.MONTHLY_VIEWS_DATABASE_ID }}
          FOLLOWER_SNAPSHOTS_DATABASE_ID: ${{ secrets.FOLLOWER_SNAPSHOTS_DATABASE_ID }}
        run: node scripts/generate-report.js "${{ github.event.inputs.month }}"

      # Overlays this run's dist/clients/ onto the existing public repo -
      # only touches reports/<month>/, reports/index.html, reports/assets/
      # and any thumbs/ this month needed, so it can't clobber the live
      # dashboard's own index.html.
      - name: Publish report to public output repo
        run: |
          cp -r dist/clients/. /tmp/dashboard-repo/
          cd /tmp/dashboard-repo
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git diff --cached --quiet || git commit -q -m "Generate report for ${{ github.event.inputs.month }}"
          git push -q origin main
