name: Daily sync + dashboard deploy

on:
  schedule:
    # 04:00 UTC ~= 6am Europe/Bucharest (EET, UTC+2) in winter / 7am (EEST,
    # UTC+3) in summer. GitHub Actions cron doesn't follow DST, so this
    # drifts by an hour for half the year - not worth extra complexity for
    # a once-a-day analytics sync.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          CHANNEL_STATS_DATABASE_ID: ${{ secrets.CHANNEL_STATS_DATABASE_ID }}
          MONTHLY_VIEWS_DATABASE_ID: ${{ secrets.MONTHLY_VIEWS_DATABASE_ID }}
          TIKTOK_SNAPSHOT_DATABASE_ID: ${{ secrets.TIKTOK_SNAPSHOT_DATABASE_ID }}
        run: npm run sync

      - name: Deploy dashboard to SiteBunker via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: '45.86.220.131'
          username: 'kpgyaqan'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: '22'
          local_path: './dist/clients/isogreen/*'
          remote_path: '/home/kpgyaqan/upfilm.ro/clients/isogreen'
          sftp_only: true
