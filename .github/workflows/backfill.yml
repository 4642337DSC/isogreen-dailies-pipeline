name: Manual backfill

on:
  workflow_dispatch:
    inputs:
      script:
        description: Which backfill to run
        required: true
        type: choice
        options:
          - thumbnails
          - monthly-views
          - tiktok-monthly
          - create-daily-views-db
          - daily-views
          - create-follower-snapshots-db
          - fix-facebook-daily
          - follower-history
          - clean-instagram-zero-views

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          CHANNEL_STATS_DATABASE_ID: ${{ secrets.CHANNEL_STATS_DATABASE_ID }}
          MONTHLY_VIEWS_DATABASE_ID: ${{ secrets.MONTHLY_VIEWS_DATABASE_ID }}
          DAILY_VIEWS_DATABASE_ID: ${{ secrets.DAILY_VIEWS_DATABASE_ID }}
          FOLLOWER_SNAPSHOTS_DATABASE_ID: ${{ secrets.FOLLOWER_SNAPSHOTS_DATABASE_ID }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run backfill:${{ github.event.inputs.script }}

      # Overlays this run's dist/clients/ onto the existing public repo
      # rather than replacing it wholesale - this backfill only produces
      # thumbs/, not index.html, so a wholesale overwrite would delete the
      # live dashboard from the public repo.
      - name: Publish built dashboard to public output repo
        if: ${{ github.event.inputs.script == 'thumbnails' }}
        run: |
          git clone -q "https://x-access-token:${DASHBOARD_REPO_PAT}@github.com/4642337DSC/isogreen-dailies-dashboard.git" /tmp/dashboard-repo
          cp -r dist/clients/. /tmp/dashboard-repo/
          cd /tmp/dashboard-repo
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git diff --cached --quiet || git commit -q -m "Deploy dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q origin main
        env:
          DASHBOARD_REPO_PAT: ${{ secrets.DASHBOARD_REPO_PAT }}
