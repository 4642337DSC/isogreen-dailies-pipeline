<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client dashboards</title>
<meta name="description" content="Client performance dashboards." />
<style>
  :root {
    color-scheme: light;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --muted: #898781;
    --border: rgba(11,11,11,0.10);
    --accent: #5b3fae;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --muted: #8f8d86;
      --border: rgba(255,255,255,0.10);
      --accent: #8f7fe0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
  }
  .wrap { width: 100%; max-width: 480px; padding: 32px; }
  h1 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 20px;
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  a {
    display: block;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Client dashboards</h1>
    <ul>
      <li><a href="/clients/isogreen/">ISOGREEN</a></li>
    </ul>
  </div>
</body>
</html>
