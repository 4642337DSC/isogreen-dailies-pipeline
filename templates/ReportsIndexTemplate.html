<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapoarte — __CLIENT_NAME__</title>
<style>
/*__FONT_FACE__*/
:root {
  --bg: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232322;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #8f8d86;
  --border: rgba(255,255,255,0.10);
  --accent: #8f7fe0;
  --font-display: "Acre", -apple-system, "Segoe UI Semibold", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Acre", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: 56px 28px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
li { background: var(--surface); }
a { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; color: var(--ink); text-decoration: none; font-size: 14.5px; }
a:hover { background: var(--surface-2); }
.arrow { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Rapoarte lunare</h1>
    <div class="sub">__CLIENT_NAME__ — un deviz pentru fiecare lună cu materiale postate</div>
    <ul>
/*__REPORT_LINKS_HTML__*/
    </ul>
  </div>
</body>
</html>
